<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>记账本</title>
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="离线可用的家庭记账本，多设备自动同步">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="记账本">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="month-nav">
        <button id="prev-month" class="nav-btn" aria-label="上一月">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="month-label" id="month-label">—</div>
        <button id="next-month" class="nav-btn" aria-label="下一月">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="top-right">
        <button id="this-month" class="today-btn">本月</button>
        <span class="sync-chip off" id="sync-chip" title="同步状态"><i></i><b>未配置</b></span>
      </div>
    </header>

    <div class="ledger-row" id="ledger-row"></div>

    <div class="install-banner" id="install-banner" hidden>
      <span class="ib-ico">📲</span>
      <div class="ib-txt"><b>把记账本装到手机桌面</b><em>全屏运行 · 断网可用</em></div>
      <button class="ib-btn" id="ib-install">安 装</button>
      <button class="ib-x" id="ib-dismiss" aria-label="关闭">✕</button>
      <div class="ib-help" id="ib-help" hidden>
        当前浏览器不支持一键安装，可以：<br>
        ① 点浏览器菜单（底部 ≡ 或右上 ⋮）→ <b>添加至桌面 / 添加到主屏幕</b>；<br>
        ② 想要真正的 App 体验：在应用商店安装 <b>Edge</b> 或 <b>Chrome</b> 浏览器，重新打开本页再点安装；<br>
        ③ 直接下载 <a href="./jizhang.apk">APK 安装包</a>（华为等浏览器装不上时用这个）。
      </div>
    </div>

    <section class="hero">
      <div class="hero-k">本月结余</div>
      <div class="hero-v" id="sum-net">¥0.00</div>
      <div class="hero-row">
        <div class="hero-cell"><span class="k">支出</span><span class="v expense" id="sum-expense">¥0.00</span></div>
        <div class="hero-cell"><span class="k">收入</span><span class="v income" id="sum-income">¥0.00</span></div>
      </div>
    </section>

    <main id="view"></main>

    <nav class="tabbar">
      <button class="tab" data-tab="add">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>记一笔</span>
      </button>
      <button class="tab" data-tab="list">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>明细</span>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>统计</span>
      </button>
      <button class="tab" data-tab="set">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./sync.js"></script>
  <script src="./app.js"></script>
</body>
</html>
