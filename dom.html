<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>记账本</title>
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="离线可用的家庭记账本，多设备自动同步">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="记账本">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="month-nav">
        <button id="prev-month" class="nav-btn" aria-label="上一月">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="month-label" id="month-label">2026年11月</div>
        <button id="next-month" class="nav-btn" aria-label="下一月">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="top-right">
        <button id="this-month" class="today-btn">本月</button>
        <span class="sync-chip off" id="sync-chip" title="未配置同步（数据只存在本机）"><i></i><b>未配置</b></span>
      </div>
    </header>

    <div class="ledger-row" id="ledger-row">
    <button class="lchip on" data-ledger="main">?? 主账本</button><button class="lchip lchip-add" id="btn-add-ledger">＋ 新账本</button></div>

    <section class="hero">
      <div class="hero-k">本月支出</div>
      <div class="hero-v" id="sum-expense">￥0.00</div>
      <div class="hero-row">
        <div class="hero-cell"><span class="k">收入</span><span class="v income" id="sum-income">￥0.00</span></div>
        <div class="hero-cell"><span class="k">结余</span><span class="v" id="sum-net">￥0.00</span></div>
      </div>
    </section>

    <main id="view">
    <div class="card">
      <div class="chart-title">日历总览 · 点某天看当天、记账</div>
      <div class="cal-head"><span class="cal-wd">日</span><span class="cal-wd">一</span><span class="cal-wd">二</span><span class="cal-wd">三</span><span class="cal-wd">四</span><span class="cal-wd">五</span><span class="cal-wd">六</span></div><div class="cal-grid"><div class="cal-cell" data-day="2026-11-01"><span class="cd">1</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-02"><span class="cd">2</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-03"><span class="cd">3</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-04"><span class="cd">4</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-05"><span class="cd">5</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-06"><span class="cd">6</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-07"><span class="cd">7</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-08"><span class="cd">8</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-09"><span class="cd">9</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-10"><span class="cd">10</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-11"><span class="cd">11</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-12"><span class="cd">12</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-13"><span class="cd">13</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-14"><span class="cd">14</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-15"><span class="cd">15</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-16"><span class="cd">16</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-17"><span class="cd">17</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-18"><span class="cd">18</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-19"><span class="cd">19</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-20"><span class="cd">20</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-21"><span class="cd">21</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-22"><span class="cd">22</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-23"><span class="cd">23</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-24"><span class="cd">24</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-25"><span class="cd">25</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell today sel" data-day="2026-11-26"><span class="cd">26</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-27"><span class="cd">27</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-28"><span class="cd">28</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-29"><span class="cd">29</span><span class="ce"></span><span class="ci"></span></div><div class="cal-cell" data-day="2026-11-30"><span class="cd">30</span><span class="ce"></span><span class="ci"></span></div></div>
    </div>
    <div class="card">
      <div class="dp-head">
        <div class="dp-date">11月26日 周四</div>
        <div class="dp-sum">支出 ￥0.00</div>
      </div>
      <button class="btn-primary" id="btn-day-add" style="margin:2px 0 12px">?? 记一笔</button>
      <div class="dp-empty">这天还没有记录</div>
    </div></main>

    <nav class="tabbar">
      <button class="tab on" data-tab="add">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        <span>记一笔</span>
      </button>
      <button class="tab" data-tab="list">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        <span>明细</span>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span>统计</span>
      </button>
      <button class="tab" data-tab="set">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden=""></div>

  <script src="./sync.js"></script>
  <script src="./app.js"></script>


</body></html>
